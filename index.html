<script src="races.js"></script>


<script>

    /* =========================
       데이터 확인
    ========================= */

    if (
        typeof races === "undefined" ||
        !Array.isArray(races)
    ) {

        document.getElementById("raceList").innerHTML = `

            <div class="empty">

                <h3>
                    대회 데이터를 불러오지 못했습니다.
                </h3>

                <p>
                    races.js 파일이 index.html과 같은 폴더에 있는지 확인해주세요.
                </p>

            </div>

        `;

    } else {


        /* =========================
           요소
        ========================= */

        const keywordInput =
            document.getElementById("keyword");

        const regionSelect =
            document.getElementById("region");

        const distanceSelect =
            document.getElementById("distance");

        const monthSelect =
            document.getElementById("month");

        const searchBtn =
            document.getElementById("searchBtn");

        const resetBtn =
            document.getElementById("resetBtn");

        const openBtn =
            document.getElementById("openBtn");

        const thisMonthBtn =
            document.getElementById("thisMonthBtn");

        const raceList =
            document.getElementById("raceList");

        const resultInfo =
            document.getElementById("resultInfo");

        const totalCount =
            document.getElementById("totalCount");

        const openCount =
            document.getElementById("openCount");

        const monthCount =
            document.getElementById("monthCount");


        let openOnly = false;


        /* =========================
           지역 자동 생성
        ========================= */

        function createRegionOptions() {

            const regions =
                [
                    ...new Set(
                        races
                            .map(
                                race =>
                                    race.region
                            )
                            .filter(
                                region =>
                                    region &&
                                    String(region).trim()
                            )
                    )
                ]
                .sort(
                    (a, b) =>
                        String(a)
                            .localeCompare(
                                String(b),
                                "ko"
                            )
                );


            regions.forEach(
                region => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        region;

                    option.textContent =
                        region;

                    regionSelect.appendChild(
                        option
                    );

                }
            );

        }


        /* =========================
           거리 자동 생성
        ========================= */

        function createDistanceOptions() {

            const distances =
                [
                    ...new Set(
                        races
                            .flatMap(
                                race =>
                                    Array.isArray(
                                        race.distances
                                    )
                                    ? race.distances
                                    : []
                            )
                            .filter(
                                distance =>
                                    distance &&
                                    String(distance).trim()
                            )
                    )
                ];


            /*
             * 일반적으로 많이 쓰는 거리 순서
             */

            const preferredOrder = [
                "5km",
                "10km",
                "15km",
                "20km",
                "하프",
                "풀코스"
            ];


            distances.sort(
                (a, b) => {

                    const aIndex =
                        preferredOrder.indexOf(a);

                    const bIndex =
                        preferredOrder.indexOf(b);


                    if (
                        aIndex !== -1 &&
                        bIndex !== -1
                    ) {

                        return aIndex - bIndex;

                    }


                    if (aIndex !== -1) {
                        return -1;
                    }


                    if (bIndex !== -1) {
                        return 1;
                    }


                    return String(a)
                        .localeCompare(
                            String(b),
                            "ko"
                        );

                }
            );


            distances.forEach(
                distance => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        distance;

                    option.textContent =
                        distance;

                    distanceSelect.appendChild(
                        option
                    );

                }
            );

        }


        /* =========================
           통계
        ========================= */

        function updateStats() {

            const today =
                new Date();


            const currentMonth =
                String(
                    today.getMonth() + 1
                ).padStart(2, "0");


            totalCount.textContent =
                races.length;


            openCount.textContent =
                races.filter(
                    race =>
                        race.status === "접수 중"
                ).length;


            monthCount.textContent =
                races.filter(
                    race =>
                        String(
                            race.date || ""
                        ).substring(5, 7)
                        === currentMonth
                ).length;

        }


        /* =========================
           날짜
        ========================= */

        function formatDate(dateString) {

            if (!dateString) {
                return "";
            }


            const parts =
                dateString.split("-");


            if (parts.length !== 3) {
                return dateString;
            }


            const year =
                Number(parts[0]);

            const month =
                Number(parts[1]);

            const day =
                Number(parts[2]);


            const date =
                new Date(
                    year,
                    month - 1,
                    day
                );


            const weekdays = [
                "일",
                "월",
                "화",
                "수",
                "목",
                "금",
                "토"
            ];


            return `${year}년 ${month}월 ${day}일 (${weekdays[date.getDay()]})`;

        }


        /* =========================
           상태
        ========================= */

        function getStatusClass(status) {

            if (status === "접수 중") {
                return "open";
            }


            if (status === "접수 예정") {
                return "soon";
            }


            return "";

        }


        /* =========================
           거리 뱃지
        ========================= */

        function createDistanceHTML(
            distances
        ) {

            if (!Array.isArray(distances)) {
                return "";
            }


            return distances
                .map(
                    distance =>
                        `<span class="badge">${distance}</span>`
                )
                .join("");

        }


        /* =========================
           상세정보
        ========================= */

        function toggleDetail(button) {

            const detail =
                button.nextElementSibling;


            if (!detail) {
                return;
            }


            const isOpen =
                detail.classList.toggle(
                    "show"
                );


            if (isOpen) {

                button.textContent =
                    "▲ 상세정보 닫기";

            } else {

                button.textContent =
                    "▼ 상세정보 보기";

            }

        }


        /* =========================
           대회 카드
        ========================= */

        function createRaceCard(race) {

            const distanceHTML =
                createDistanceHTML(
                    race.distances
                );


            const statusClass =
                getStatusClass(
                    race.status
                );


            const homepageHTML =
                race.url

                ?

                `<a
                    class="home-link"
                    href="${race.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    공식 홈페이지 / 신청하기 →
                </a>`

                :

                `<span class="home-link disabled">
                    공식 홈페이지 정보 없음
                </span>`;


            return `

                <article class="race-card">

                    <div class="card-top">

                        <div>

                            <div class="race-date">
                                📅 ${formatDate(race.date)}
                            </div>


                            <h3>
                                ${race.name}
                            </h3>

                        </div>


                        <div class="status ${statusClass}">
                            ${race.status || "상태 확인 필요"}
                        </div>

                    </div>


                    <div class="badges">
                        ${distanceHTML}
                    </div>


                    <div class="info">

                        📍 ${race.region}
                        · ${race.place}<br>

                        💰 참가비 :
                        ${race.price || "공식 홈페이지 확인"}

                    </div>


                    <button
                        class="detail-btn"
                        onclick="toggleDetail(this)"
                    >
                        ▼ 상세정보 보기
                    </button>


                    <div class="detail-box">

                        <div class="detail-title">
                            🏃 대회 상세정보
                        </div>


                        <div class="detail-grid">

                            <div class="detail-item">

                                <span class="detail-label">
                                    대회일
                                </span>

                                <span class="detail-value">
                                    ${formatDate(race.date)}
                                </span>

                            </div>


                            <div class="detail-item">

                                <span class="detail-label">
                                    접수 상태
                                </span>

                                <span class="detail-value">
                                    ${race.status || "확인 필요"}
                                </span>

                            </div>


                            <div class="detail-item">

                                <span class="detail-label">
                                    지역
                                </span>

                                <span class="detail-value">
                                    ${race.region || "정보 없음"}
                                </span>

                            </div>


                            <div class="detail-item">

                                <span class="detail-label">
                                    장소
                                </span>

                                <span class="detail-value">
                                    ${race.place || "정보 없음"}
                                </span>

                            </div>


                            <div class="detail-item">

                                <span class="detail-label">
                                    참가 종목
                                </span>

                                <span class="detail-value">

                                    ${
                                        Array.isArray(
                                            race.distances
                                        )

                                        ?

                                        race.distances.join(
                                            " · "
                                        )

                                        :

                                        "정보 없음"
                                    }

                                </span>

                            </div>


                            <div class="detail-item">

                                <span class="detail-label">
                                    참가비
                                </span>

                                <span class="detail-value">
                                    ${race.price || "공식 홈페이지 확인"}
                                </span>

                            </div>


                            <div class="detail-item">

                                <span class="detail-label">
                                    접수기간
                                </span>

                                <span class="detail-value">
                                    ${race.period || "공식 홈페이지 확인"}
                                </span>

                            </div>

                        </div>


                        ${homepageHTML}

                    </div>

                </article>

            `;

        }


        /* =========================
           검색
        ========================= */

        function searchRaces() {

            const keyword =
                keywordInput.value
                    .trim()
                    .toLowerCase();


            const region =
                regionSelect.value;


            const distance =
                distanceSelect.value;


            const month =
                monthSelect.value;


            const filteredRaces =
                races
                .filter(
                    race => {

                        const raceName =
                            String(
                                race.name || ""
                            ).toLowerCase();


                        const raceRegion =
                            String(
                                race.region || ""
                            ).toLowerCase();


                        const racePlace =
                            String(
                                race.place || ""
                            ).toLowerCase();


                        const raceDistances =
                            Array.isArray(
                                race.distances
                            )

                            ?

                            race.distances
                                .join(" ")
                                .toLowerCase()

                            :

                            "";


                        const searchText = `
                            ${raceName}
                            ${raceRegion}
                            ${racePlace}
                            ${raceDistances}
                        `.toLowerCase();


                        const matchesKeyword =
                            !keyword ||
                            searchText.includes(
                                keyword
                            );


                        const matchesRegion =
                            !region ||
                            race.region === region;


                        const matchesDistance =
                            !distance ||
                            (
                                Array.isArray(
                                    race.distances
                                ) &&
                                race.distances.includes(
                                    distance
                                )
                            );


                        const matchesMonth =
                            !month ||
                            String(
                                race.date || ""
                            ).substring(
                                5,
                                7
                            ) === month;


                        const matchesOpen =
                            !openOnly ||
                            race.status === "접수 중";


                        return (
                            matchesKeyword &&
                            matchesRegion &&
                            matchesDistance &&
                            matchesMonth &&
                            matchesOpen
                        );

                    }
                )
                .sort(
                    (a, b) =>
                        String(
                            a.date || ""
                        ).localeCompare(
                            String(
                                b.date || ""
                            )
                        )
                );


            resultInfo.innerHTML =
                `총 <strong>${filteredRaces.length}</strong>개의 대회`;


            if (
                filteredRaces.length === 0
            ) {

                raceList.innerHTML = `

                    <div class="empty">

                        <h3>
                            검색 결과가 없습니다.
                        </h3>

                        <p>
                            검색 조건을 변경해보세요.
                        </p>

                    </div>

                `;

            } else {

                raceList.innerHTML =
                    filteredRaces
                        .map(
                            createRaceCard
                        )
                        .join("");

            }

        }


        /* =========================
           검색
        ========================= */

        searchBtn.addEventListener(
            "click",
            searchRaces
        );


        keywordInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    searchRaces();

                }

            }
        );


        /* =========================
           접수 중
        ========================= */

        openBtn.addEventListener(
            "click",
            function() {

                openOnly =
                    !openOnly;


                openBtn.classList.toggle(
                    "active",
                    openOnly
                );


                searchRaces();

            }
        );


        /* =========================
           이번 달
        ========================= */

        thisMonthBtn.addEventListener(
            "click",
            function() {

                const today =
                    new Date();


                const month =
                    String(
                        today.getMonth() + 1
                    ).padStart(
                        2,
                        "0"
                    );


                monthSelect.value =
                    month;


                searchRaces();

            }
        );


        /* =========================
           초기화
        ========================= */

        resetBtn.addEventListener(
            "click",
            function() {

                keywordInput.value = "";

                regionSelect.value = "";

                distanceSelect.value = "";

                monthSelect.value = "";

                openOnly = false;


                openBtn.classList.remove(
                    "active"
                );


                searchRaces();

            }
        );


        /* =========================
           실행
        ========================= */

        createRegionOptions();

        createDistanceOptions();

        updateStats();

        searchRaces();

    }

</script>

</body>
</html>
