        /* =========================

        footer {

        /* =========================

        @media (max-width: 800px) {

            .search-grid {

        @media (max-width: 550px) {

</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">

    </div>

</header>


<main>

    <section class="intro">

        <h2>
            2026 전국 마라톤 일정
        </h2>

        <p>
            지역, 거리, 월별로 원하는 마라톤 대회를 쉽게 찾아보세요.
        </p>

    </section>


    <section class="search-box">

        <div class="search-title">
            🔎 마라톤 대회 검색
        </div>


        <div class="search-grid">

            <input
                type="text"
                id="keyword"
                placeholder="대회명, 지역, 장소, 거리 검색"
            >


            <select id="region">

                <option value="">
                    전체 지역
                </option>

                <option value="서울">서울</option>
                <option value="경기">경기</option>
                <option value="인천">인천</option>
                <option value="강원">강원</option>
                <option value="대전">대전</option>
                <option value="세종">세종</option>
                <option value="충북">충북</option>
                <option value="충남">충남</option>
                <option value="광주">광주</option>
                <option value="전북">전북</option>
                <option value="전남">전남</option>
                <option value="부산">부산</option>
                <option value="울산">울산</option>
                <option value="경남">경남</option>
                <option value="대구">대구</option>
                <option value="경북">경북</option>
                <option value="제주">제주</option>

            </select>


            <select id="distance">

                <option value="">
                    전체 거리
                </option>

                <option value="5km">5km</option>
                <option value="10km">10km</option>
                <option value="하프">하프</option>
                <option value="풀코스">풀코스</option>

            </select>


            <select id="month">

                <option value="">
                    전체 월
                </option>

                <option value="09">9월</option>
                <option value="10">10월</option>
                <option value="11">11월</option>
                <option value="12">12월</option>

            </select>


            <button
                class="search-btn"
                id="searchBtn"
            >
                검색
            </button>

        </div>


        <div class="quick-filter">

            <button
                class="quick-btn"
                id="openBtn"
            >
                🟢 접수 중
            </button>

            <button
                class="quick-btn"
                id="thisMonthBtn"
            >
                📅 이번 달
            </button>

        </div>


        <button
            class="reset-btn"
            id="resetBtn"
        >
            초기화
        </button>

    </section>


    <div class="result-bar">

        <div
            class="result-info"
            id="resultInfo"
        >
        </div>

    </div>


    <section
        class="race-list"
        id="raceList"
    >
    </section>

</main>


<footer>
    © 2026 여기런 · 전국 마라톤 대회 정보
</footer>


<script src="races.js"></script>


<script>

    if (
        typeof races === "undefined" ||
        !Array.isArray(races)
    ) {

        document.getElementById("raceList").innerHTML = `

            <div class="empty">

                <h3>
                    대회 데이터를 불러오지 못했습니다.
                </h3>

                <p>
                    races.js 파일이 index.html과 같은 폴더에 있는지 확인해주세요.
                </p>

            </div>

        `;

    } else {


        const keywordInput =
            document.getElementById("keyword");

        const regionSelect =
            document.getElementById("region");

        const distanceSelect =
            document.getElementById("distance");

        const monthSelect =
            document.getElementById("month");


        const searchBtn =
            document.getElementById("searchBtn");

        const resetBtn =
            document.getElementById("resetBtn");

        const openBtn =
            document.getElementById("openBtn");

        const thisMonthBtn =
            document.getElementById("thisMonthBtn");


        const raceList =
            document.getElementById("raceList");

        const resultInfo =
            document.getElementById("resultInfo");


        let openOnly = false;


        /* =========================
           날짜 표시
        ========================= */

        function formatDate(dateString) {

            if (!dateString) {
                return "";
            }

            const parts =
                dateString.split("-");

            if (parts.length !== 3) {
                return dateString;
            }

            const year =
                Number(parts[0]);

            const month =
                Number(parts[1]);

            const day =
                Number(parts[2]);


            const date =
                new Date(
                    year,
                    month - 1,
                    day
                );


            const weekdays =
                [
                    "일",
                    "월",
                    "화",
                    "수",
                    "목",
                    "금",
                    "토"
                ];


            return `${year}년 ${month}월 ${day}일 (${weekdays[date.getDay()]})`;

        }


        /* =========================
           상태 스타일
        ========================= */

        function getStatusClass(status) {

            if (status === "접수 중") {
                return "open";
            }

            if (status === "접수 예정") {
                return "soon";
            }

            return "";

        }


        /* =========================
           카드 생성
        ========================= */

        function createRaceCard(race) {

            const distanceHTML =
                Array.isArray(race.distances)

                ? race.distances
                    .map(
                        distance =>
                            `<span class="badge">${distance}</span>`
                    )
                    .join("")

                : "";


            const statusClass =
                getStatusClass(race.status);


            return `

                <article class="race-card">

                    <div class="card-top">

                        <div>

                            <div class="race-date">
                                📅 ${formatDate(race.date)}
                            </div>

                            <h3>
                                ${race.name}
                            </h3>

                        </div>


                        <div
                            class="status ${statusClass}"
                        >
                            ${race.status || "상태 확인 필요"}
                        </div>

                    </div>


                    <div class="badges">

                        ${distanceHTML}

                    </div>


                    <div class="info">

                        📍 지역 : ${race.region}<br>

                        🏟 장소 : ${race.place}<br>

                        💰 참가비 :
                        ${race.price || "공식 홈페이지 확인"}<br>

                        📝 접수기간 :
                        ${race.period || "공식 홈페이지 확인"}

                    </div>


                    ${
                        race.url

                        ?

                        `<a
                            class="home-link"
                            href="${race.url}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            공식 홈페이지 →
                        </a>`

                        :

                        `<span class="home-link">
                            공식 홈페이지 확인
                        </span>`
                    }

                </article>

            `;

        }


        /* =========================
           검색
        ========================= */

        function searchRaces() {

            const keyword =
                keywordInput.value
                    .trim()
                    .toLowerCase();


            const region =
                regionSelect.value;


            const distance =
                distanceSelect.value;


            const month =
                monthSelect.value;


            const filteredRaces =
                races

                .filter(race => {

                    const raceName =
                        String(
                            race.name || ""
                        ).toLowerCase();


                    const raceRegion =
                        String(
                            race.region || ""
                        ).toLowerCase();


                    const racePlace =
                        String(
                            race.place || ""
                        ).toLowerCase();


                    const raceDistances =
                        Array.isArray(race.distances)
                        ? race.distances
                            .join(" ")
                            .toLowerCase()
                        : "";


                    const searchText =
                        `
                        ${raceName}
                        ${raceRegion}
                        ${racePlace}
                        ${raceDistances}
                        `.toLowerCase();


                    const matchesKeyword =
                        !keyword ||
                        searchText.includes(keyword);


                    const matchesRegion =
                        !region ||
                        race.region === region;


                    const matchesDistance =
                        !distance ||
                        (
                            Array.isArray(race.distances) &&
                            race.distances.includes(distance)
                        );


                    const matchesMonth =
                        !month ||
                        String(
                            race.date || ""
                        ).substring(5, 7) === month;


                    const matchesOpen =
                        !openOnly ||
                        race.status === "접수 중";


                    return (

                        matchesKeyword &&
                        matchesRegion &&
                        matchesDistance &&
                        matchesMonth &&
                        matchesOpen

                    );

                })

                .sort(
                    (a, b) =>
                        String(a.date || "")
                            .localeCompare(
                                String(b.date || "")
                            )
                );


            resultInfo.innerHTML =
                `총 <strong>${filteredRaces.length}</strong>개의 대회`;


            if (
                filteredRaces.length === 0
            ) {

                raceList.innerHTML = `

                    <div class="empty">

                        <h3>
                            검색 결과가 없습니다.
                        </h3>

                        <p>
                            검색 조건을 변경해보세요.
                        </p>

                    </div>

                `;

            } else {

                raceList.innerHTML =
                    filteredRaces
                        .map(createRaceCard)
                        .join("");

            }

        }


        /* =========================
           검색 버튼
        ========================= */

        searchBtn.addEventListener(
            "click",
            searchRaces
        );


        keywordInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    searchRaces();

                }

            }
        );


        /* =========================
           접수 중
        ========================= */

        openBtn.addEventListener(
            "click",
            function() {

                openOnly =
                    !openOnly;


                openBtn.classList.toggle(
                    "active",
                    openOnly
                );


                searchRaces();

            }
        );


        /* =========================
           이번 달
        ========================= */

        thisMonthBtn.addEventListener(
            "click",
            function() {

                const today =
                    new Date();


                const month =
                    String(
                        today.getMonth() + 1
                    ).padStart(2, "0");


                monthSelect.value =
                    month;


                searchRaces();

            }
        );


        /* =========================
           초기화
        ========================= */

        resetBtn.addEventListener(
            "click",
            function() {

                keywordInput.value = "";

                regionSelect.value = "";

                distanceSelect.value = "";

                monthSelect.value = "";

                openOnly = false;

                openBtn.classList.remove(
                    "active"
                );


                searchRaces();

            }
        );


        /* =========================
           최초 실행
        ========================= */

        searchRaces();

    }

</script>

</body>
</html>
