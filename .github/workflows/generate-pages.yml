name: Generate race detail pages and sitemap

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'races.js'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate detail pages and sitemap
        run: node generate-pages.js

      - name: Check generated pages
        run: |
          echo "생성된 races 폴더:"
          ls -la races/
          echo ""
          echo "사이트맵 확인:"
          test -f sitemap.xml
          echo "sitemap.xml 생성 확인 완료"
          echo ""
          echo "이일선마라톤 페이지 확인:"
          test -f races/2026-iilseon-marathon.html
          echo "2026-iilseon-marathon.html 생성 확인 완료"

      - name: Commit generated pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add races/ sitemap.xml

          if git diff --cached --quiet; then
            echo "변경된 파일이 없습니다."
          else
            git commit -m "Auto-generate race pages and sitemap"
            git push
          fi
