name: Test generate race detail page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate detail pages
        run: node generate-pages.js

      - name: Check generated page
        run: |
          echo "생성된 races 폴더:"
          ls -la races/
          echo ""
          echo "이일선마라톤 페이지 확인:"
          test -f races/2026-iilseon-marathon.html
          echo "2026-iilseon-marathon.html 생성 확인 완료"

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add races/ sitemap.xml
          git diff --cached --quiet || git commit -m "Test generate race detail pages"
          git push
